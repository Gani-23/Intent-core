name: "Intent Guard PR Auditor"
description: "Audit agent execution traces and post intent drift reports directly to GitHub Pull Requests"
author: "Living Systems Auditor Team"
branding:
  icon: "shield"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token (e.g. secrets.GH_TOKEN or auto-fallback to github.token)"
    required: false
    default: ${{ github.token }}
  pr_number:
    description: "Pull request number (defaults to github.event.pull_request.number)"
    required: false
  report_dir:
    description: "Directory containing generated session report markdown files"
    required: false
    default: ".intent-guard/reports"
  api_url:
    description: "Optional LSA central API URL for remote organization telemetry"
    required: false
  api_key:
    description: "Optional LSA API Key"
    required: false
  upload_artifact:
    description: "Whether to upload the session reports as a downloadable GitHub Actions build artifact"
    required: false
    default: "true"
  artifact_name:
    description: "Name of the uploaded artifact in the GitHub Actions run summary"
    required: false
    default: "intent-guard-audit-reports"
  auto_audit_pr:
    description: "Whether to dynamically audit PR git changes against PR title/body if no pre-existing session reports are found"
    required: false
    default: "true"

outputs:
  findings_count:
    description: "Total number of drift findings detected across all session reports"
    value: ${{ steps.commenter.outputs.findings_count }}
  reports_found:
    description: "Number of session report files evaluated"
    value: ${{ steps.commenter.outputs.reports_found }}

runs:
  using: "composite"
  steps:
    - name: Run Intent Guard PR Commenter
      id: commenter
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPORT_DIR: ${{ inputs.report_dir }}
        LSA_API_URL: ${{ inputs.api_url }}
        LSA_API_KEY: ${{ inputs.api_key }}
        AUTO_AUDIT_PR: ${{ inputs.auto_audit_pr }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "${{ github.action_path }}/action/pr_commenter.py"

    - name: Upload Intent Guard Audit Reports Artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.report_dir }}
        if-no-files-found: ignore
